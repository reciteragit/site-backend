<div class="recitera-weekly-editor" data-weekly-editor>
  <textarea name="{{ widget.name }}" id="{{ widget.attrs.id }}" hidden>{{ widget.value }}</textarea>
  <p class="weekly-editor-note">Set local weekly hours. Each range is split into complete classes using the duration above.</p>
  <div data-weekly-days></div>
  <p class="weekly-editor-note">Copy to weekdays replaces Monday–Friday hours in this form. Nothing changes on the site until you save.</p>
</div>
